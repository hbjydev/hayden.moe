[settings]
experimental = true

[tools]
aube = { version = "v2.11.0", workflow = ["release-plz.yml@refs/heads/main", "release.yml@refs/heads/main"] }
awscli = { version = "2.42.4", symlink_bins = "true" }
fnox = { version = "v1.50.0", workflow = "release.yml" }
jactionlint = { version = "v2.7.0", workflow = "release.yaml" }
shellcheck = "0.11.0"

[deps.aube]
auto = true
run = "aube ci"

[tasks.build]
description = "Build the site"
run = "aube run build"

[tasks.deploy]
description = "Deploy the site"
secrets = ["AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY"]
env = { AWS_REGION = "uk", AWS_ENDPOINT_URL_S3 = "https://s3.uk.io.cloud.ovh.net" }
run = '''
aws s3 sync \
  ./dist s3://hayden.moe \
  --region $AWS_REGION \
  --endpoint-url $AWS_ENDPOINT_URL_S3 \
  --delete \
  --acl public-read
'''

[secrets.fnox]
